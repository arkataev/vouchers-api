[project]
name = "test-vaucher"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex Kataev",email = "alexander.kataev@wolt.com"}
]
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.12.5,<3.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "aiosqlite (>=0.20.0,<1.0.0)",
    "fastapi (>=0.132.0,<=0.133.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pytest (>=9.0.2,<=10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[flake8]
max-line-length = 100